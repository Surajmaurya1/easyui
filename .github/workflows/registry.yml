name: Registry CI

on:
  push:
    branches: [main, suraj/dev0]
  pull_request:
    branches: [main, suraj/dev0]

jobs:
  validate:
    name: Validate Registry, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate and validate registry
        run: npm run component:sync

      - name: Verify generated registry files are committed and in sync
        run: |
          generated_paths=(
            registry.json
            public/registry.json
            public/source
            public/prompts
            public/sitemap.xml
            public/llms.txt
            src/components/registry/catalog-index.ts
            src/components/registry/component-details.ts
            src/components/registry/details
          )

          if [[ -n "$(git status --porcelain --untracked-files=all -- "${generated_paths[@]}")" ]]; then
            git status --short --untracked-files=all -- "${generated_paths[@]}"
            echo "::error::Generated registry files are out of sync with source files. Run 'npm run component:sync' locally and commit the changes."
            exit 1
          fi

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc -b

      - name: Run tests
        run: npm run test

      - name: Run build
        run: npm run build
