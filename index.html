<!doctype html>
<html lang="en">
  <head>
    <meta name="google-site-verification" content="2ztRO5MqBgvGBRflOG4999rLD7Tn3U_BlXn3_7tmgtg" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Pre-mount theme bootstrap. Runs synchronously before React paints so
         there is no flash of incorrect theme on first load. Reads
         localStorage('easyui-theme') first, then falls back to the OS
         prefers-color-scheme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('easyui-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* no-op */
        }
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>EasyUI — Beautiful UI. Made easy.</title>
    <meta name="title" content="EasyUI — Beautiful UI. Made easy." />
    <meta name="description" content="Production-ready, beautifully crafted animated UI components built with React, Tailwind CSS, and Framer Motion for modern web applications." />
    <meta name="keywords" content="React components, UI library, Framer Motion, Tailwind CSS, Accessible UI, Design System, Animation components, shadcn/ui compatible, Modern React UI, EasyUI" />
    <meta name="author" content="Suraj Maurya" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Base JSON-LD Structured Data for Initial Crawl -->

      "@graph": [
        {
          "@type": "WebSite",
          "name": "EasyUI",
          "url": "https://easyui.site",
          "description": "Production-ready, beautifully crafted animated UI components built with React, Tailwind CSS, and Framer Motion for modern web applications.",
          "inLanguage": "en-US",
          "author": {

          ],

            "name": "Suraj Maurya"
          }
        }
      ]
    }
